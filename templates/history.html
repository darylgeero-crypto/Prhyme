{% extends "base.html" %}
{% block content %}
<div class="phead">
  <span class="pico spin">🕘</span>
  <div>
    <div class="ptitle-row"><h2 class="ptitle">History</h2><a class="help-link" href="{{ url_for('help_page') }}#history" aria-label="Help">?</a></div>
    <p class="plead">Your recent renders — download again or bundle them as a ZIP.</p>
  </div>
</div>

<div class="btnrow" style="margin-bottom:14px">
  <button id="zipBtn" class="btn">🗜 Bundle recent as ZIP</button>
</div>
<div id="zipOut" class="result"></div>
<div id="histList"><div class="skel"></div><div class="skel" style="margin-top:10px"></div></div>
{% endblock %}
{% block scripts %}
<script>
(async function () {
  const list = document.getElementById("histList");
  try {
    const r = await fetch("/api/history");
    const j = await r.json();
    if (!j.ok || !j.history.length) {
      list.innerHTML = '<p class="plead">Nothing yet — master a track or make a beat and it\'ll show up here.</p>';
      return;
    }
    list.innerHTML = j.history.map(h => {
      const r = h.result || {};
      const when = new Date(h.at * 1000).toLocaleString();
      let dls = "";
      for (const k of ["mp3", "wav", "mp4", "file"]) {
        if (r[k]) dls += '<a class="dl alt" style="padding:8px 12px;min-height:44px;font-size:14px" href="/download/' +
          encodeURIComponent(r[k]) + '?dl=1">⬇ ' + k.toUpperCase() + '</a>';
      }
      let meta = (r.lufs !== undefined ? r.lufs + " LUFS · " : "") +
        (r.bpm ? r.bpm + " BPM · " : "") + (r.duration ? r.duration + "s" : "");
      // inline preview: hear it before you download it
      const prevFile = r.mp3 || r.wav;
      const prev = prevFile ? '<div class="hprev"><audio controls preload="none" style="width:100%;height:36px" src="/download/' +
        encodeURIComponent(prevFile) + '"></audio></div>' : "";
      return '<div class="histitem"><div class="ht">' + escapeHtml(h.kind) +
        (h.title ? " — " + escapeHtml(h.title) : "") + '</div>' +
        '<div class="hm">' + when + (meta ? " · " + meta : "") + '</div>' +
        prev +
        '<div class="hd">' + dls + '</div></div>';
    }).join("");
  } catch (e) {
    list.innerHTML = '<div class="err">Couldn\'t load history</div>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  document.getElementById("zipBtn").addEventListener("click", async () => {
    const out = document.getElementById("zipOut");
    out.innerHTML = '<div class="jobmsg">Bundling…</div>';
    try {
      const r = await fetch("/api/history/zip", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({}) });
      const j = await r.json();
      if (!j.ok) { out.innerHTML = '<div class="err">' + escapeHtml(j.error) + "</div>"; return; }
      out.innerHTML = '<a class="dl" href="/download/' + encodeURIComponent(j.zip) +
        '?dl=1">⬇ Download ZIP (' + j.count + ' files)</a>';
      toast("Bundle ready");
    } catch (e) { out.innerHTML = '<div class="err">Network error</div>'; }
  });
})();
</script>
{% endblock %}
