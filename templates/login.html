{% extends "base.html" %}
{% block content %}
<div class="phead">
  <span class="pico pulse">🔑</span>
  <div>
    <div class="ptitle-row"><h2 class="ptitle">Log in</h2></div>
    <p class="plead">Welcome back to the studio.</p>
  </div>
</div>

<div class="bill-form-card">
  {% if error %}<div class="bill-note warn">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('billing.login_post') }}{% if request.args.get('next') %}?next={{ request.args.get('next')|urlencode }}{% endif %}">
    <label class="bill-label">Email
      <input class="txt" type="email" name="email" required autocomplete="email"
             placeholder="you@example.com">
    </label>
    <label class="bill-label">Password
      <input class="txt" type="password" name="password" required
             autocomplete="current-password" placeholder="••••••••">
    </label>
    <button class="btn" type="submit" style="width:100%;margin-top:12px">Log in →</button>
  </form>
  <p class="bill-alt">
    <a href="#" onclick="billForgot(event)">Forgot password?</a><br>
    No account? <a href="{{ url_for('billing.signup') }}">Sign up free →</a>
  </p>
  <div id="forgotMsg" class="bill-note" style="display:none"></div>
</div>

<script>
async function billForgot(e) {
  e.preventDefault();
  const email = prompt("Enter your account email:");
  if (!email) return;
  const r = await fetch("{{ url_for('billing.api_forgot') }}", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({email})
  });
  const j = await r.json();
  const m = document.getElementById("forgotMsg");
  m.style.display = "block";
  m.textContent = j.message || "Done.";
}
</script>
{% endblock %}
