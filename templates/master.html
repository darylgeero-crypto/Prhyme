{% extends "base.html" %}
{% block content %}
<h2>Master</h2>
<form id="f" enctype="multipart/form-data">
  <input type="file" name="file" accept="audio/*" required><br><br>
  <input type="text" name="title" placeholder="Track title"><br><br>
  <button type="submit">Master it</button>
</form>
<div id="out"></div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('out').textContent = 'Uploading...';
  const fd = new FormData(e.target);
  try {
    const r = await fetch('/api/master', {method:'POST', body:fd});
    const j = await r.json();
    document.getElementById('out').textContent = j.ok ? 'Job started: '+j.job_id : 'Error: '+j.error;
  } catch(err) {
    document.getElementById('out').textContent = 'Failed: '+err;
  }
});
</script>
{% endblock %}
